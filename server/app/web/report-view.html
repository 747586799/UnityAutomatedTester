<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#080b12" media="(prefers-color-scheme:dark)">
<title>Report View</title>
<style>
:root {
  --color-bg: #f6f7fb;
  --color-surface: #ffffff;
  --color-text: #111827;
  --color-text-secondary: #64748b;
  --color-text-muted: #94a3b8;
  --color-border: #e2e8f0;
  --color-primary: #0f766e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #080b12;
    --color-surface: #0f172a;
    --color-text: #e5e7eb;
    --color-text-secondary: #94a3b8;
    --color-text-muted: #64748b;
    --color-border: #1f2937;
    --color-primary: #2dd4bf;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "SF Mono", Consolas, "Liberation Mono", monospace;
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.6;
  font-size: 13px;
}
.header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  font-family: system-ui, -apple-system, sans-serif;
}
.header h1 {
  font-size: 16px;
  font-weight: 800;
}
.header .meta {
  font-size: 12px;
  color: var(--color-text-secondary);
}
.loading, .error, .empty {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 50vh;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 14px;
}
.error { color: #991b1b; }
.empty { color: var(--color-text-muted); }
pre.report-content {
  padding: 16px 20px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  line-height: 1.55;
  font-size: 13px;
}
</style>
</head>
<body>
<div id="root">
  <div class="loading">Loading report...</div>
</div>

<script>
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const groupHistoryId = params.get('group_history_id');
  const instanceId = params.get('instance_id');

  if (!groupHistoryId || !instanceId) {
    document.getElementById('root').innerHTML = '<div class="error">缺少参数: 需要 group_history_id 和 instance_id</div>';
    return;
  }

  const url = '/api/unity/history/groups/' + encodeURIComponent(groupHistoryId) + '/instances/' + encodeURIComponent(instanceId);
  const label = instanceId;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const report = data.report;

    if (!report) {
      document.getElementById('root').innerHTML = '<div class="empty">该实例无 report 数据</div>';
      return;
    }

    const root = document.getElementById('root');
    root.innerHTML = `
      <div class="header">
        <div>
          <h1>Report</h1>
          <div class="meta">${escapeHtml(label)}</div>
        </div>
      </div>
      <pre class="report-content">${escapeHtml(report)}</pre>
    `;
  } catch (e) {
    document.getElementById('root').innerHTML = '<div class="error">加载失败: ' + escapeHtml(e.message) + '</div>';
  }
}

loadReport();
</script>
</body>
</html>
